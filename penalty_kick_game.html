<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>축구 패널티킥 챌린지</title>
<style>
:root{--green:#167a3d;--dark:#10251b;--gold:#ffd34e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#10251b,#07130e);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:18px}
.game{width:min(920px,100%);background:#142b20;border:1px solid #315740;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#0d2117}
h1{font-size:clamp(21px,4vw,30px);margin:0}.sub{color:#b8d1c0;font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#203e2d;border-radius:12px;padding:8px 13px;text-align:center;min-width:78px}.stat b{display:block;font-size:21px;color:var(--gold)}
main{padding:18px}.pitch{position:relative;overflow:hidden;border-radius:16px;background:repeating-linear-gradient(0deg,#25834b 0 75px,#217944 75px 150px);height:clamp(290px,53vw,470px);border:3px solid #d9f0df}
.pitch:before{content:"";position:absolute;inset:10% 9% 0;border:2px solid #d7f0df88;border-bottom:0;border-radius:50% 50% 0 0/22% 22% 0 0}
.goal{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:58%;height:35%;border:8px solid #f4f4f4;border-bottom:0;background:repeating-linear-gradient(90deg,transparent 0 9%,#ffffff22 9% 10%),repeating-linear-gradient(0deg,transparent 0 17%,#ffffff22 17% 18%);box-shadow:0 0 0 2px #263b30}
.goal:after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:8px;background:#f4f4f4}
.keeper{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);font-size:clamp(42px,8vw,68px);filter:drop-shadow(0 4px 2px #123)}
.ball{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);font-size:34px;transition:all .45s cubic-bezier(.2,.8,.2,1);z-index:3}
.ball.kick-left{left:27%;top:23%;bottom:auto;transform:translate(-50%,-50%) scale(.65)}
.ball.kick-center{left:50%;top:23%;bottom:auto;transform:translate(-50%,-50%) scale(.65)}
.ball.kick-right{left:73%;top:23%;bottom:auto;transform:translate(-50%,-50%) scale(.65)}
.ball.saved{filter:grayscale(1);opacity:.5}
.goalmark{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,5vw,38px);font-weight:900;text-shadow:0 3px 8px #000}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.panel{background:#1b3928;border-radius:14px;padding:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:0;border-radius:10px;padding:12px 8px;font-weight:800;font-size:15px;cursor:pointer;background:#e8f4eb;color:#173624;transition:.15s}
button:hover:not(:disabled){transform:translateY(-2px);background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.kick{background:var(--gold);color:#332800;width:100%;margin-top:10px}
.message{margin-top:13px;text-align:center;min-height:27px;font-weight:750;color:#ffdf74}
footer{padding:0 18px 18px;text-align:center;color:#b8d1c0;font-size:12px}
@media(max-width:620px){.controls{grid-template-columns:1fr}.goal{width:68%}}
</style>
</head>
<body>
<div class="game">
<header><div><h1>⚽ 패널티킥 챌린지</h1><div class="sub">골키퍼를 속이고 5번의 기회 안에 최대한 많이 득점하세요!</div></div>
<div class="stats"><div class="stat">득점<b id="score">0</b></div><div class="stat">선방<b id="saves">0</b></div><div class="stat">남은 슛<b id="left">5</b></div></div></header>
<main>
<div class="pitch" aria-label="축구 경기장">
 <div class="goal"></div><div class="keeper" id="keeper">🧤</div>
 <div class="goalmark" id="goalmark"></div><div class="ball" id="ball">⚽</div>
</div>
<div class="controls">
 <section class="panel"><h2>① 슛 방향 선택</h2><div class="buttons">
 <button data-dir="left">↖ 왼쪽</button><button data-dir="center">↑ 중앙</button><button data-dir="right">↗ 오른쪽</button>
 </div><button class="kick" id="kick" disabled>슛!</button></section>
 <section class="panel"><h2>② 골키퍼 방향 예측</h2><div class="buttons">
 <button data-guess="left">← 왼쪽</button><button data-guess="center">↑ 중앙</button><button data-guess="right">→ 오른쪽</button>
 </div><div class="sub" style="margin-top:9px">슛 방향과 골키퍼의 예측 방향이 다르면 골!</div></section>
</div>
<div class="message" id="message">슛 방향과 골키퍼 예측 방향을 선택하세요.</div>
</main>
<footer>방향을 고른 뒤 슛 버튼을 누르세요. 5번의 슛이 끝나면 다시 도전할 수 있어요!</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let direction=null,guess=null,score=0,saves=0,left=5,playing=false;
const labels={left:"왼쪽",center:"중앙",right:"오른쪽"};
function update(){
 $('score').textContent=score;$('saves').textContent=saves;$('left').textContent=left;
 document.querySelectorAll('[data-dir]').forEach(b=>b.style.outline=b.dataset.dir===direction?'3px solid #ffd34e':'none');
 document.querySelectorAll('[data-guess]').forEach(b=>b.style.outline=b.dataset.guess===guess?'3px solid #ffd34e':'none');
 $('kick').disabled=playing||!direction||!guess||left===0;
}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(!playing&&left>0){direction=b.dataset.dir;update();}});
document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{if(!playing&&left>0){guess=b.dataset.guess;update();}});
$('kick').onclick=()=>{
 if(playing||!direction||!guess||left<=0)return;
 playing=true;left--;const keeper=['left','center','right'][Math.floor(Math.random()*3)];
 $('ball').className='ball kick-'+direction;
 $('keeper').style.left=({left:'28%',center:'50%',right:'72%'}[keeper]);
 $('goalmark').textContent='';
 setTimeout(()=>{
  const goal=direction!==keeper;
  if(goal){score++;$('goalmark').textContent='⚽ GOAL!';$('message').textContent='골인! '+labels[direction]+'쪽으로 정확하게 찼어요!';}
  else{saves++;$('goalmark').textContent='🧤 SAVE!';$('ball').classList.add('saved');$('message').textContent='아쉽네요! 골키퍼가 '+labels[keeper]+'쪽 슛을 막았어요.';}
  update();
  setTimeout(()=>{
   $('ball').className='ball';$('keeper').style.left='50%';$('goalmark').textContent='';
   direction=null;guess=null;playing=false;
   if(left===0){$('message').textContent='경기 종료! '+score+'골을 넣었어요. 다시 도전해 보세요!';$('kick').textContent='다시 시작';$('kick').disabled=false;$('kick').onclick=reset;}
   else update();
  },1050);
 },480);
 update();
};
function reset(){score=0;saves=0;left=5;direction=null;guess=null;playing=false;$('kick').textContent='슛!';$('kick').onclick=kickHandler;$('message').textContent='슛 방향과 골키퍼 예측 방향을 선택하세요.';update();}
const kickHandler=$('kick').onclick;
update();
</script>
</body>
</html>
